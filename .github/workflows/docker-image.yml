name: Build & publish image

# Builds the combined media-vault image and pushes it to GitHub Container
# Registry (GHCR) so self-hosters just pull, never build.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Don't rebuild the image for changes that don't affect the running app
    # (docs, the CA template/profile, repo icons) — this stops Unraid from
    # showing a phantom "update available". Release tags always build (their
    # commit bumps package.json, which isn't ignored), and workflow_dispatch is
    # always a manual override.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'templates/**'
      - 'unraid-template/**'
      - 'ca_profile.xml'
      - 'icon.svg'
      - 'icon.png'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/media-vault

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Publish a plain single-manifest image (no attestation index), so
          # Unraid's update check can compare digests instead of "not available".
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
