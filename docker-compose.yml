# media-vault — one-command self-host stack (single app image + Postgres).
#   cp .env.example .env        # fill in your keys
#   docker compose up -d        # pulls the prebuilt image
# Update later with:  docker compose pull && docker compose up -d   (no rebuild)
# App on http://localhost:${FRONTEND_PORT} (default 8080).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # First-time initdb on slow (e.g. Unraid array) storage can take ~1 min.
      start_period: 120s

  app:
    # Prebuilt image (auto-published to GHCR). Falls back to a local build if pulled fails.
    image: ghcr.io/halvar20000/media-vault:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKEND_PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      NODE_ENV: ${NODE_ENV}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      MARKETPLACE: ${MARKETPLACE:-leboncoin}
      EASYCASH_STORE: ${EASYCASH_STORE:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@media-vault.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-changeme}
      SEED_USER_NAME: ${SEED_USER_NAME:-Collector}
      SEED_CSV: /app/seed/master_game_list.csv
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN}
      DISCOGS_KEY: ${DISCOGS_KEY}
      DISCOGS_SECRET: ${DISCOGS_SECRET}
      DISCOGS_USER_AGENT: ${DISCOGS_USER_AGENT:-media-vault/0.1}
      PRICECHARTING_TOKEN: ${PRICECHARTING_TOKEN}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_DE}
      VALUATION_CURRENCY: ${VALUATION_CURRENCY:-EUR}
    volumes:
      # Canonical seed list, mounted read-only (no duplication in the image).
      - ./master_game_list.csv:/app/seed/master_game_list.csv:ro
      # Cached cover images — bind-mounted so they persist and are easy to back up.
      - ./data/covers:/app/data/covers
    ports:
      - "${FRONTEND_PORT:-8080}:4000"

volumes:
  pgdata:
